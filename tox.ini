# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist =
    py38-django{22,30,31,32}
    py39-django{32,40,41,42}
    py310-django{40,41,42,50,51}
    py311-django{50,51,52}
    py312-django{52,60}
    py313-django{60,61}

skip_missing_interpreters = true

[testenv]
deps =
    django22: Django>=2.2,<3.0
    django30: Django>=3.0,<3.1
    django31: Django>=3.1,<3.2
    django32: Django>=3.2,<4.0
    django40: Django>=4.0,<4.1
    django41: Django>=4.1,<4.2
    django42: Django>=4.2,<5.0
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1

[gh]
python =
    3.13 = py313-django{60,61}
    3.12 = py312-django{52,60}
    3.11 = py311-django{50,51,52}
    3.10 = py310-django{40,41,42,50,51}
    3.9 = py39-django{32,40,41,42}
    3.8 = py38-django{22,30,31,32}

commands = {envpython} runtests.py {posargs}
setenv = PYTHONPATH = .:{toxworkdir}
