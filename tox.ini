# tox (https://tox.wiki/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist =
    py{310,311}-django52
    py{312,313,314}-django{52,60,61}
    py315-django61

skip_missing_interpreters = true

[testenv]
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands = {envpython} -W default::DeprecationWarning runtests.py {posargs}

[gh]
python =
    3.15 = py315-django61
    3.14 = py314-django{52,60,61}
    3.13 = py313-django{52,60,61}
    3.12 = py312-django{52,60,61}
    3.11 = py311-django52
    3.10 = py310-django52
